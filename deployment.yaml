apiVersion: apps/v1
kind: Deployment

metadata:
  name: website-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mywebsite

  template:
    metadata:
      labels:
        app: mywebsite

    spec:
      containers:
        - name: website
          image: website:test
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
